# Services associés en local : base PostgreSQL avec pgvector.
# Le backend et le frontend se lancent directement sur la machine (voir README.md).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smartcampus-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartcampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcampus}
      POSTGRES_DB: ${POSTGRES_DB:-smartcampus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartcampus} -d ${POSTGRES_DB:-smartcampus}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
